name: Sync README Command Reference

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "develop", "main" ]

permissions:
  contents: read

jobs:
  sync-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      # Runs on every PR into develop (and into main, as a final check on promotion), so drift
      # gets caught before it lands anywhere - develop requires PRs for all changes, so this
      # can't auto-commit/push a fix directly to it (that used to work before branch protection
      # was added). Instead this fails the check with instructions, the same way
      # Invoke-ScriptAnalyzer already gates PSScriptAnalyzer.yml.
      - name: Check README command reference is up to date
        shell: pwsh
        run: ./tools/Update-ReadmeCommandReference.ps1 -Check
