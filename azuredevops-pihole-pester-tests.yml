trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  name: mmadeja-dt

variables:
  - group: dns3
  - name: testResultsFile
    value: '$(System.DefaultWorkingDirectory)/TestResults/pester.xml'

steps:
  - pwsh: |
      # Pinned to major version 5 specifically (not just ">= 5.0.0", which would also accept a
      # newer major version like 6.x if one happens to be installed on the agent - Pester's
      # result-object shape isn't guaranteed compatible across major versions, and the rest of
      # this pipeline (including the failed-test summary below) depends on Pester 5's shape).
      $pester = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -eq 5 } | Sort-Object Version -Descending | Select-Object -First 1
      if (-not $pester) {
        Write-Host "Installing Pester 5..."
        Install-Module -Name Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser
      }
      else {
        Write-Host "Using Pester $($pester.Version)"
      }
    displayName: 'Ensure Pester 5 is available'

  - pwsh: |
      $configContent = @"
      `$PiHoleServer = [uri]'$env:PIHOLE_SERVER'
      `$PiHoleToken = '$env:PIHOLE_TOKEN'
      `$PiHoleIgnoreSsl = $env:PIHOLE_IGNORE_SSL
      "@
      Set-Content -Path (Join-Path '$(System.DefaultWorkingDirectory)' 'tests/IntegrationConfig.local.ps1') -Value $configContent -Encoding utf8
    displayName: 'Write integration test config'
    env:
      PIHOLE_SERVER: $(PiHoleServer)
      PIHOLE_TOKEN: $(PiHoleToken)
      PIHOLE_IGNORE_SSL: $(PiHoleIgnoreSsl)

  - pwsh: |
      Import-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99 -Force

      # On a PR build, scope the run to tests for the files that actually changed - tests/ mirrors
      # PiHoleShell/Public/<Category>/ 1:1, so a changed function maps directly to its test file(s).
      # Any ambiguity (shared/private code, module manifest, shared test helpers, or the diff itself
      # failing) falls back to the full suite rather than risk silently skipping real coverage.
      # Direct pushes to develop/main (not PR builds) always run the full suite.
      $runFullSuite = $true
      $testPaths = [System.Collections.Generic.List[string]]::new()

      if ($env:BUILD_REASON -eq 'PullRequest') {
          try {
              # The default checkout is shallow, which leaves no common ancestor with the target
              # branch to diff against ("no merge base") - unshallow first so the diff can work.
              if ((git rev-parse --is-shallow-repository) -eq 'true') {
                  git fetch --unshallow --quiet
                  if ($LASTEXITCODE -ne 0) { throw "git fetch --unshallow failed" }
              }

              # Fetch with an explicit refspec so origin/<branch> is created even if the
              # checkout's default fetch refspec is restricted to a single branch.
              $targetBranch = $env:SYSTEM_PULLREQUEST_TARGETBRANCH -replace '^refs/heads/', ''
              git fetch origin "${targetBranch}:refs/remotes/origin/${targetBranch}" --quiet
              if ($LASTEXITCODE -ne 0) { throw "git fetch failed for '$targetBranch'" }

              $changedFiles = git diff --name-only "origin/$targetBranch...HEAD"
              if ($LASTEXITCODE -ne 0) { throw "git diff failed against 'origin/$targetBranch'" }

              if ($changedFiles) {
                  $runFullSuite = $false

                  foreach ($file in $changedFiles) {
                      if ($runFullSuite) { break }

                      if ($file -match '^PiHoleShell/Private/' -or
                          $file -eq 'PiHoleShell/PiHoleShell.psm1' -or
                          $file -eq 'PiHoleShell/PiHoleShell.psd1' -or
                          $file -eq 'PiHoleShell/Public/Authentication/Request-PiHoleAuth.ps1' -or
                          $file -eq 'tests/Initialize-PiHoleTestData.ps1' -or
                          $file -eq 'tests/IntegrationConfig.example.ps1') {
                          Write-Host "Shared/core file changed ($file) - running the full suite"
                          $runFullSuite = $true
                      }
                      elseif ($file -match '^PiHoleShell/Public/([^/]+)/([^/]+)\.ps1$') {
                          $category = $Matches[1]
                          $function = $Matches[2]
                          $testDir = "tests/$category"
                          if (Test-Path $testDir) {
                              Get-ChildItem -Path $testDir -Filter "$function.*Tests.ps1" | ForEach-Object {
                                  $testPaths.Add($_.FullName)
                              }
                          }
                      }
                      elseif ($file -match '^tests/.*\.Tests\.ps1$' -and (Test-Path $file)) {
                          $testPaths.Add((Resolve-Path $file).Path)
                      }
                      # Anything else (README, workflows, tools/, etc.) has no test impact - ignored.
                  }
              }
          }
          catch {
              Write-Warning "Could not compute changed-file test scope, falling back to the full suite: $($_.Exception.Message)"
              $runFullSuite = $true
          }
      }

      $config = New-PesterConfiguration
      # Exit is handled manually below (after printing the failed-test summary) instead of
      # letting Invoke-Pester call exit itself, which would skip that summary entirely.
      $config.Run.Exit = $false
      $config.Run.PassThru = $true
      $config.Output.Verbosity = 'Detailed'
      $config.TestResult.Enabled = $true
      $config.TestResult.OutputFormat = 'NUnitXml'
      $config.TestResult.OutputPath = '$(testResultsFile)'

      $testPaths = $testPaths | Select-Object -Unique
      if ($runFullSuite -or $testPaths.Count -eq 0) {
          Write-Host "Running the full test suite"
          $config.Run.Path = './tests'
      }
      else {
          Write-Host "Running scoped tests for changed files:"
          $testPaths | ForEach-Object { Write-Host "  $_" }
          $config.Run.Path = $testPaths
      }

      $result = Invoke-Pester -Configuration $config

      if ($result.FailedCount -gt 0) {
          Write-Host ""
          Write-Host "=================================================="
          Write-Host " FAILED TESTS ($($result.FailedCount))"
          Write-Host "=================================================="
          foreach ($test in $result.Failed) {
              Write-Host ""
              Write-Host "[-] $($test.ExpandedPath)"
              foreach ($errorRecord in $test.ErrorRecord) {
                  Write-Host "    $($errorRecord.Exception.Message)"
              }
          }
          Write-Host ""
      }

      exit $result.FailedCount
    displayName: 'Run Pester tests'
    workingDirectory: '$(System.DefaultWorkingDirectory)'

  - pwsh: |
      Remove-Item -Path (Join-Path '$(System.DefaultWorkingDirectory)' 'tests/IntegrationConfig.local.ps1') -Force -ErrorAction SilentlyContinue
    displayName: 'Clean up integration test config'
    condition: always()

  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'NUnit'
      testResultsFiles: '$(testResultsFile)'
      failTaskOnFailedTests: false
